- name: Run Phoenix Build System
  run: |
    python3 scripts/phoenix_build.py
- name: Phoenix CI Check
  run: |
    python3 phoenix-ci/core/ci_manager.py

- name: Hardware Test Framework
  run: |
    python3 phoenix-testing/core/test_manager.py

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main


jobs:

  project-check:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4


      - name: Check project structure
        run: |
          echo "Checking Phoenix NetHunter structure"

          test -d docs
          test -d kernel
          test -d drivers
          test -d scripts
          test -d kali-rootfs
          test -d nethunter-core

          echo "Structure OK"


      - name: Check scripts
        run: |
          echo "Checking scripts"

          test -f scripts/setup.sh
          test -f scripts/build.sh

          echo "Scripts OK"